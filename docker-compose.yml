services:
  postgres:
    image: postgres:16
    container_name: mvp-shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mvp_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrator
    container_name: mvp-shop-migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=mvp_shop;Username=postgres;Password=postgres
      Seed__ForceReseedProducts: "true"
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvp-shop-web
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=mvp_shop;Username=postgres;Password=postgres
      OpenTelemetry__Otlp__Endpoint: http://tempo:4317
      Seed__ApplyMigrationsOnStartup: "true"
      Seed__ForceReseedProducts: "false"
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__ChatId: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: mvp-shop-prometheus
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.1
    container_name: mvp-shop-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_DISABLE_PLUGINS: grafana-lokiexplore-app,grafana-pyroscope-app,grafana-metricsdrilldown-app
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

  loki:
    image: grafana/loki:3.1.1
    container_name: mvp-shop-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.8.2
    container_name: mvp-shop-tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo/tempo.yml" ]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"

  promtail:
    image: grafana/promtail:3.1.1
    container_name: mvp-shop-promtail
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - promtail_data:/tmp
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:
  tempo_data:
